[package]
name = "openfin8-ca"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OpenFin8/openfin8-ca"
rust-version = "1.85"
description = "Sentin8 OpenFin8:CA - Canadian open-banking data provider (FDX v6.x wire): consent-checked data sharing."

[[bin]]
name = "openfin8-ca"
path = "src/main.rs"

[lib]
name = "openfin8_ca_server"
path = "src/lib.rs"

[dependencies]
# Platform SDK pin (RS 2.3) - the only cross-repo dependency.
sentin8 = { git = "https://github.com/Sentin8/sentin8-sdk", tag = "sdk-v0.6.20" }
# The open-banking kernel: the entire shared implementation.
openfin8-core = { git = "https://github.com/OpenFin8/openfin8-core", tag = "openfin8-v0.1.1" }
# bank8 namespace facade pin (registration types ride the shell).
bank8 = { git = "https://github.com/Bank8-dev/bank8-sdk", tag = "bank8-v0.5.9" }

axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
utoipa = { version = "5", features = ["chrono", "uuid", "decimal"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "macros", "rust_decimal"] }
